<ion-card (click)="goToDetail()">
  <ion-card-header>
    <ion-card-subtitle>{{ news.category }}</ion-card-subtitle>
    <ion-card-title>{{ news.trend_name }}</ion-card-title>
  </ion-card-header>
  <ion-card-content>
    <ion-text color="medium">
      <p>{{ news.post_count }} · {{ news.trending_since }}</p>
    </ion-text>
  </ion-card-content>
</ion-card>
