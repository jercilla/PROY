<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="goToSettings()">
        <ion-icon slot="icon-only" name="settings-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Home</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="goToHistory()">
        <ion-icon slot="icon-only" name="bookmark-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-chip color="warning">
    <ion-icon name="calendar-outline"></ion-icon>
    <ion-label>{{ currentDate }}</ion-label>
  </ion-chip>

  <ion-text>
    <h2>Bienvenido {{ user?.email }}</h2>
  </ion-text>

  <div *ngIf="isLoading" class="ion-text-center ion-padding-vertical">
    <ion-spinner name="crescent"></ion-spinner>
    <p>Cargando noticias...</p>
  </div>

  <swiper-container
    *ngIf="!isLoading && trendingNews.length > 0"
    [slidesPerView]="slideOpts.slidesPerView"
    [spaceBetween]="slideOpts.spaceBetween"
    [pagination]="slideOpts.pagination"
    class="trending-swiper"
  >
    <swiper-slide *ngFor="let news of trendingNews">
      <app-trend-card [news]="news"></app-trend-card>
    </swiper-slide>
    <div class="swiper-pagination"></div> 
  </swiper-container>

  <ion-text *ngIf="!isLoading && trendingNews.length === 0" color="medium" class="ion-text-center ion-padding-vertical">
    <p>No hay noticias de tendencia disponibles en este momento.</p>
  </ion-text>

  <ion-button expand="block" (click)="goToDetail()">
    Detalles
  </ion-button>

  <ion-button expand="block" (click)="goToNew()">
    Crear
  </ion-button>

  <ion-text color="medium" class="ion-text-center">
    <p>
      <small>Last update {{ lastUpdate }}</small>
      <ion-icon name="refresh-outline" (click)="refreshCards()"></ion-icon>
    </p>
  </ion-text>
</ion-content>
