<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/dashboard" text=""></ion-back-button>
    </ion-buttons>
    <ion-title class="header-title">Creador de Contenido</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding new-container">
  <!-- Tarjeta de Tendencia -->
  <ion-card>
    <ion-card-content>
      {{ trend?.trend_name }}
    </ion-card-content>
  </ion-card>

  <!-- Controles de Generación -->
  <div class="controls-section">
    <!-- Control de Longitud -->
    <div>
      <ion-label class="range-value">Longitud: {{ length }} car.</ion-label>
      <ion-range class="custom-pin"
        [(ngModel)]="length"
        min="1"
        max="280"
        pin="true"
        [pinFormatter]="pinFormatter">
      </ion-range>
    </div>

    <!-- Control de Tono -->
    <div>
      <ion-label class="range-value">Tono: {{ getToneLabel() }}</ion-label>
      <ion-range class="custom-pin"
        [(ngModel)]="tonePercentage"
        min="0"
        max="3">
      </ion-range>
    </div>

    <!-- Toggle Hashtag -->
    <div class="toggle-item-container">
      <ion-item lines="none" class="range-value">
        <ion-label class="range-value">Hashtag</ion-label>
        <ion-toggle [(ngModel)]="hashtags"></ion-toggle>
      </ion-item>
    </div>

    <!-- Toggle Emoji -->
    <div class="toggle-item-container">
      <ion-item lines="none" class="range-value">
        <ion-label class="range-value">Emoji</ion-label>
        <ion-toggle [(ngModel)]="emojis"></ion-toggle>
      </ion-item>
    </div>
  </div>

  <!-- Botón Generar -->
  <ion-button expand="block" (click)="generar()" class="color-green">
    Generar
  </ion-button>

  <!-- Sección de Resultado -->
  <div class="resultado-section" *ngIf="mostrarResultado">
    <h3>Resultado,</h3>

    <ion-card>
      <ion-card-content>
        <ion-textarea
          [(ngModel)]="resultado"
          [readonly]="!modoEdicion"
          rows="8"
          class="resultado-textarea">
        </ion-textarea>
      </ion-card-content>
    </ion-card>

    <!-- Botones de Acción -->
    <div class="action-buttons">
      <ion-button shape="round" (click)="editar()">
        Editar
      </ion-button>
      <ion-button shape="round" (click)="copiar()">
        Copiar
      </ion-button>
      <ion-button shape="round" (click)="guardar()">
        Guardar
      </ion-button>
    </div>
  </div>
</ion-content>
